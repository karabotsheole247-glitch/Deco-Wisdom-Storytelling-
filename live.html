<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live | Deco Wisdom Live App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: white;
    }

    header {
      padding: 18px;
      background: #111;
    }

    header a {
      color: #e8b84a;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      padding: 25px 18px;
    }

    .live-badge {
      display: inline-block;
      background: #d62828;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #181818;
      border: 1px solid #333;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin: 20px 0;
    }

    .play {
      font-size: 55px;
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #aaa;
      line-height: 1.5;
    }

    .event {
      margin-top: 25px;
      padding: 20px;
      background: #151515;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Back to Home</a>
  </header>

  <div class="container">

    <span class="live-badge">● LIVE</span>

    <h1>Deco Wisdom Live</h1>

    <div class="player">
      <div>
        <div class="play">▶</div>
        <p>Live stream will appear here</p>
      </div>
    </div>

    <div class="event">
      <h2>Live Event</h2>
      <br>
      <p>
        Welcome to the Deco Wisdom live experience.
        The real streaming system will be connected here.
      </p>
    </div>

  </div>

</body>
</html>

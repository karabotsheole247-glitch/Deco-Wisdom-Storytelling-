<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Registration | Deco Wisdom Live App">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: white;
    }

    header {
      padding: 18px;
      background: #111;
    }

    header a {
      color: #e8b84a;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    h1 {
      margin-bottom: 10px;
      color: #e8b84a;
    }

    .intro {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .form-card {
      background: #161616;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 22px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #333;
      border-radius: 7px;
      background: #0d0d0d;
      color: white;
      font-size: 15px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 8px;
      background: #e8b84a;
      color: #000;
      font-weight: bold;
      font-size: 16px;
    }

    .note {
      margin-top: 15px;
      color: #888;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Back to Home</a>
  </header>

  <div class="container">

    <h1>Artist Registration 🎤</h1>

    <p class="intro">
      Apply to become an artist on the Deco Wisdom Live App.
      Your application will be reviewed by the platform team.
    </p>

    <div class="form-card">

      <label for="fullName">Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
      >

      <label for="artistName">Artist / Stage Name</label>
      <input
        type="text"
        id="artistName"
        placeholder="Enter your artist name"
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
      >

      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
      >

      <label for="genre">Genre</label>
      <select id="genre">
        <option value="">Select a genre</option>
        <option>Music</option>
        <option>Comedy</option>
        <option>Poetry</option>
        <option>Dance</option>
        <option>Talk / Interview</option>
        <option>Other</option>
      </select>

      <label for="social">Social Media / Profile Link</label>
      <input
        type="url"
        id="social"
        placeholder="https://..."
      >

      <label for="bio">Artist Bio</label>
      <textarea
        id="bio"
        placeholder="Tell us about yourself and your work..."
      ></textarea>

      <button type="button">
        Submit Artist Application
      </button>

      <p class="note">
        Submitting an application does not guarantee approval.
        Applications will be reviewed before an artist is accepted.
      </p>

    </div>

  </div>

</body>
</html>

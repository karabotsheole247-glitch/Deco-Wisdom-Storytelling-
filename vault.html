<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Vault | Deco Wisdom Live App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: white;
    }

    header {
      padding: 18px;
      background: #111;
    }

    header a {
      color: #e8b84a;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      padding: 25px 18px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .intro {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .video-card {
      background: #161616;
      border: 1px solid #292929;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .thumbnail {
      height: 180px;
      background: #242424;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 55px;
    }

    .video-info {
      padding: 18px;
    }

    .video-info h2 {
      color: #e8b84a;
      margin-bottom: 8px;
      font-size: 20px;
    }

    .video-info p {
      color: #aaa;
      line-height: 1.5;
    }

    .premium {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 10px;
      background: #e8b84a;
      color: #000;
      border-radius: 5px;
      font-size: 12px;
      font-weight: bold;
    }

    .subscribe {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #e8b84a;
      color: #000;
      font-weight: bold;
      font-size: 15px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Back to Home</a>
  </header>

  <div class="container">

    <h1>Video Vault 🎬</h1>

    <p class="intro">
      Explore exclusive Deco Wisdom videos and premium content.
    </p>

    <div class="video-card">

      <div class="thumbnail">
        ▶
      </div>

      <div class="video-info">
        <h2>Featured Deco Wisdom Experience</h2>

        <p>
          Exclusive video content will appear here.
        </p>

        <span class="premium">PREMIUM</span>

        <button class="subscribe">
          Subscribe to Watch
        </button>
      </div>

    </div>

    <div class="video-card">

      <div class="thumbnail">
        ▶
      </div>

      <div class="video-info">
        <h2>Latest Experience</h2>

        <p>
          New premium content coming soon.
        </p>

        <span class="premium">PREMIUM</span>

        <button class="subscribe">
          Subscribe to Watch
        </button>
      </div>

    </div>

  </div>

</body>
</html>

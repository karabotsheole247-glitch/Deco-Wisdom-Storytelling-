<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets | Deco Wisdom Live App</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #090909;
      color: white;
    }

    header {
      padding: 18px;
      background: #111;
    }

    header a {
      color: #e8b84a;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      padding: 25px 18px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .intro {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .ticket {
      background: #161616;
      border: 1px solid #292929;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .ticket h2 {
      color: #e8b84a;
      margin-bottom: 10px;
    }

    .ticket p {
      color: #aaa;
      margin-bottom: 8px;
    }

    .price {
      color: white !important;
      font-size: 20px;
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #e8b84a;
      color: #000;
      font-weight: bold;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">← Back to Home</a>
  </header>

  <div class="container">

    <h1>Tickets 🎟️</h1>

    <p class="intro">
      Get access to upcoming Deco Wisdom events and live experiences.
    </p>

    <div class="ticket">
      <h2>Deco Wisdom Live Event</h2>

      <p>📅 Date: Coming Soon</p>
      <p>📍 Location: Coming Soon</p>

      <p class="price">Ticket price: Coming Soon</p>

      <button>Get Tickets</button>
    </div>

    <div class="ticket">
      <h2>VIP Experience</h2>

      <p>Premium access to the Deco Wisdom experience.</p>

      <p class="price">VIP price: Coming Soon</p>

      <button>Get VIP Ticket</button>
    </div>

  </div>

</body>
</html>
